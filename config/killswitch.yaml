# Kill switches (PRD s.9). All triggers are configurable defaults.

daily_loss_pct: 1.5
weekly_loss_pct: 3.5

# Drawdown ladder, measured from the equity peak net of charges.
ladder:
  - {state: YELLOW, drawdown_pct: -4,  action: warn}
  - {state: ORANGE, drawdown_pct: -7,  action: reduce,  risk_multiplier: 0.5, stop_high_tail: true}
  - {state: RED,    drawdown_pct: -10, action: flatten, risk_multiplier: 0.0, stop_high_tail: true,
     halt_days: 21, require_external_key: true}
  - {state: BLACK,  drawdown_pct: -15, action: halt,    risk_multiplier: 0.0, stop_high_tail: true,
     require_external_key: true}

# Strategy-level triggers beyond the hard/soft stops in portfolio.yaml.
strategies:
  S1_ADAPTIVE_TREND:      {max_loss_streak: 12, max_slippage_ratio: 1.5, max_red_share: 0.5, max_rejections: 5}
  S2_CHANNEL_BREAKOUT:    {max_loss_streak: 12, max_slippage_ratio: 1.5, max_red_share: 0.5, max_rejections: 5}
  S3_SHORT_TERM_REVERSAL: {max_loss_streak: 8,  max_slippage_ratio: 1.5, max_red_share: 0.5, max_rejections: 5,
                           avg_loss_to_win_max: 2.0}
  S4_STAT_PAIRS:          {max_loss_streak: 6,  max_slippage_ratio: 1.5, max_red_share: 0.5, max_rejections: 5}
  S5_RANGE_IRON_CONDOR:   {max_loss_streak: 4,  max_slippage_ratio: 1.5, max_red_share: 0.5, max_rejections: 3,
                           full_loss_suspend_days: 14}

instrument_loss_budget_pct: 1.0
instrument_move_sigma: 6.0
escalate_instrument_trips: 3
escalate_strategy_trips: 3
escalate_window_days: 5
reset_cooloff_minutes: 30
data_auto_reset_minutes: 15
data_auto_reset_enabled: true
disconnect_limit_minutes: 5
margin_hard_cap_pct: 50
reduce_fraction: 0.5
loosen_cooloff_hours: 24

# SHA-256 hashes of one-time external reset codes for RED / BLACK, generated by a second
# person or device (`algotrader keygen`). Never store the codes themselves here.
external_reset_code_hashes: []
