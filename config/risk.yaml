# Layered risk limits (PRD s.7). Levels: global -> asset_class -> instruments -> strategies ->
# binding risk profile -> trade override. The STRICTEST value always wins:
#   max_* smaller wins, min_* larger wins, require_* true wins, lists are unioned.
# Tightening takes effect immediately; loosening needs a reason, confirmation and a 24h
# cooling-off (FR-7.4, see risk.gateway.LimitChangeManager).

global:
  max_risk_per_trade_pct: 0.5        # distance to stop x size, % of NAV
  require_stop: true                 # a stop or defined max loss is mandatory
  max_order_lots: 50                 # fat-finger lots limit
  max_order_value: 30000000          # fat-finger value limit (Rs 3 crore)
  max_position_pct_nav: 100          # combined notional per instrument across strategies
  max_adv_pct: 1.0
  max_gross_exposure_pct_nav: 600
  max_net_exposure_pct_nav: 300      # beta-adjusted
  max_sector_exposure_pct_nav: 150
  max_margin_util_pct: 40            # PRD default cap: 40% of capital
  margin_buffer_pct: 5               # held back for margin spikes
  price_collar_pct: 3
  max_quote_age_sec: 3600            # daily strategies decide after the close
  max_orders_per_minute: 60
  duplicate_window_sec: 5
  rejection_storm_count: 5
  rejection_storm_window_sec: 60
  max_cost_to_atr_pct: 15            # cost-viability: round trip < 15% of one daily ATR
  max_cost_to_edge_pct: 25           # when a strategy states its expected edge
  blocked_windows: [event_calendar]
  options:
    naked_short: false
    max_loss_pct_nav: 0.5

asset_class:
  stock_future:
    max_position_pct_nav: 60         # tighter per-name cap: single-stock gap risk
  index_option:
    max_order_lots: 20

instruments: {}

strategies:
  S1_ADAPTIVE_TREND:
    max_cluster_risk_pct_nav: 0.5    # same-direction equity-index risk <= one full position
  S2_CHANNEL_BREAKOUT:
    max_cluster_risk_pct_nav: 0.5
  S3_SHORT_TERM_REVERSAL:
    max_risk_per_trade_pct: 0.25
  S4_STAT_PAIRS:
    max_risk_per_trade_pct: 0.5      # pair-level risk <= 0.5% of NAV
  S5_RANGE_IRON_CONDOR:
    options:
      max_loss_pct_nav: 0.5

profiles:
  conservative:
    max_risk_per_trade_pct: 0.5
    max_position_pct_nav: 100
    max_margin_util_pct: 35
    max_adv_pct: 1
    require_stop: true
    blocked_windows: [event_calendar, last_10_min]
  defined_risk_only:
    extends: conservative
    options: {naked_short: false, max_loss_pct_nav: 0.5}
