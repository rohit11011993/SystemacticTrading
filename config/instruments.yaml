      - {effective: 2019-01-01, lot_size: 75, tick_size: 0.05}
      - {effective: 2026-01-01, lot_size: 65, tick_size: 0.05}
    strike_step: 50
    wing_width: 300
    margin_pct: 0
    session: NSE
    cost_profile: index_options
    sector: index
    cluster: india_equity_index
    # Expiry days have changed more than once; the master refresh supplies explicit dates
    # (flags.expiries). This rule is only the fallback for synthetic / offline runs.
    expiry_rule: {kind: last_weekday, weekday: 1}

