# Instrument registry (PRD s.5). Adding an instrument = adding a record here; no code change.
#
# IMPORTANT: lot sizes, tick sizes, margins and expiries below are indicative starting values.
# The daily instrument-master refresh (FR-6.2) overwrites them from the exchange/broker and
# flags any change for review. Verify every value before paper or live trading.
#
# specs: contract specification versioned by effective date (lot size changes are common).
# margin_pct: approximate initial margin as % of notional, used for the pre-trade margin rule.
# cluster: correlated-cluster key used by the cluster exposure cap.

instruments:
  NIFTY_FUT:
    symbol: NIFTY
    exchange: NFO
    segment: FUT
    type: index_future
    specs:
      - {effective: 2019-01-01, lot_size: 75, tick_size: 0.05}
      - {effective: 2026-01-01, lot_size: 65, tick_size: 0.10}
    margin_pct: 12
    session: NSE
    cost_profile: equity_futures
    sector: index
    cluster: india_equity_index
    beta: 1.0
    liquidity: {adv_lots: 200000, max_adv_pct: 1.0}
    flags: {roll_days_before_expiry: 3, open_cutoff_days: 2}

  BANKNIFTY_FUT:
    symbol: BANKNIFTY
